repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --config backend/pyproject.toml --fix
        language: system
        types_or: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format --config backend/pyproject.toml
        language: system
        types_or: [python]

      - id: mypy
        name: mypy
        entry: mypy --config-file backend/pyproject.toml
        language: system
        types_or: [python]
        pass_filenames: false
        args: ["backend"]
      
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        types_or: [python]